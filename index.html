<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Studio® | Premium Design & Development Studio</title>
    <meta name="title" content="Studio® | Premium Design & Development Studio" />
    <meta name="description" content="Global creative studio partnering with ambitious brands to define what's next in culture and technology. Strategy, UX/UI Design, and Full-Stack Engineering." />
    <meta name="keywords" content="design studio, web development, UX design, UI design, product strategy, full-stack engineering, digital agency, creative studio" />
    <meta name="author" content="Studio®" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studio.design/" />
    <meta property="og:title" content="Studio® | Premium Design & Development Studio" />
    <meta property="og:description" content="Global creative studio partnering with ambitious brands to define what's next in culture and technology." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://studio.design/" />
    <meta property="twitter:title" content="Studio® | Premium Design & Development Studio" />
    <meta property="twitter:description" content="Global creative studio partnering with ambitious brands to define what's next in culture and technology." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
            },
            colors: {
              'studio-black': '#0E0E11',
              'studio-gray': '#8A8F98',
              'studio-accent': '#7C7CFF',
            }
          }
        }
      }
    </script>
    
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      
      /* Selection color */
      ::selection {
        background-color: #000;
        color: #fff;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
